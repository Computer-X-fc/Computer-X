<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Computer X</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
    width:100%;height:100%;
    background:#080812;
    overflow:hidden;
    transition: background 1.5s ease;
}
canvas{display:block;width:100vw;height:100vh;}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let w,h;
let particles = [];
const DURATION = 5000;
const HOLD_TIME = 1000; // 修改：文字停留1秒供阅读
const DISPERSE_DURATION = 2500;
const FADE_BG_DURATION = 1500; // 背景黑白过渡时长
const FONT_SCALE = 0.21;
const TEXT_VERT_POS_RATIO = 0.5;
const STEP = 3;
const POINT_OFFSET = 5;
const PARTICLE_MIN_R = 0.3;
const PARTICLE_MAX_R = 1.0;
const BREATH_AMP = 1.2;
const BREATH_SPEED = 0.0015;
const TRAIL_ALPHA = 0.18;
const COLOR_RGBA = [110, 190, 255];
const RESIZE_DELAY = 120;
const SMOOTH_FACTOR = 0.08;
let startTime = 0;
let targetPoints = [];
let finished = false;
let holdStart = 0;
let enterDisperse = false;
let disperseStart = 0;
let resizeTimer = null;
// 新增状态：飞散完成、背景渐变、跳转标记
let disperseComplete = false;
let bgFadeStart = 0;
let pageRedirected = false;

const tempCanvas = document.createElement('canvas');
const tempCtx = tempCanvas.getContext('2d');
function resize(){
    w = canvas.width = innerWidth;
    h = canvas.height = innerHeight;
    tempCanvas.width = w;
    tempCanvas.height = h;
    targetPoints = createTargetPoints();
    if(targetPoints.length === 0) return;
    if(finished && !enterDisperse){
        adjustParticlesCount();
    }
}
function createTargetPoints(){
    const size = Math.min(w,h) * FONT_SCALE;
    tempCtx.clearRect(0,0,w,h);
    tempCtx.fillStyle="#fff";
    tempCtx.font = `bold ${size}px sans-serif`;
    tempCtx.textAlign="center";
    tempCtx.textBaseline="middle";
    tempCtx.fillText("Computer X", w/2, h * TEXT_VERT_POS_RATIO);
    const img = tempCtx.getImageData(0,0,w,h);
    const points = [];
    for(let y=0;y<h;y+=STEP){
        for(let x=0;x<w;x+=STEP){
            const i = (y*w + x)*4;
            if(img.data[i+3]>80){
                const px = x + (Math.random() - 0.5) * POINT_OFFSET;
                const py = y + (Math.random() - 0.5) * POINT_OFFSET;
                points.push({x:px,y:py});
            }
        }
    }
    return points;
}
function adjustParticlesCount(){
    const targetCount = targetPoints.length;
    while(particles.length < targetCount){
        const p = new Particle();
        p.resetRandom();
        particles.push(p);
    }
    while(particles.length > targetCount){
        particles.pop();
    }
    particles.forEach((p,i)=>{
        const t = targetPoints[i];
        p.targetX = t.x;
        p.targetY = t.y;
    });
}
class Particle{
    constructor(){
        this.resetRandom();
        this.targetX = 0;
        this.targetY = 0;
        this.tx = 0;
        this.ty = 0;
        this.breathPhase = Math.random() * Math.PI * 2;
        this.disperseVX = 0;
        this.disperseVY = 0;
    }
    resetRandom(){
        this.x = Math.random()*w;
        this.y = Math.random()*h;
        this.baseX = this.x;
        this.baseY = this.y;
        this.r = PARTICLE_MIN_R + Math.random()*(PARTICLE_MAX_R-PARTICLE_MIN_R);
    }
    setTarget(px,py){
        this.tx = px;
        this.ty = py;
    }
    initDisperse(){
        // 修改：所有粒子统一向左上角飞散，不再随机四散
        const baseSpeed = 1.2 + Math.random() * 2.2;
        this.disperseVX = -baseSpeed;
        this.disperseVY = -baseSpeed;
    }
    update(progress, time, disperseProgress){
        if(!finished){
            this.x = this.baseX + (this.tx - this.baseX)*progress;
            this.y = this.baseY + (this.ty - this.baseY)*progress;
        }else if(!enterDisperse){
            this.x += (this.targetX - this.x) * SMOOTH_FACTOR;
            this.y += (this.targetY - this.y) * SMOOTH_FACTOR;
            const breathe = Math.sin(time * BREATH_SPEED + this.breathPhase) * BREATH_AMP;
            this.x += breathe;
            this.y += breathe;
        }else{
            this.x += this.disperseVX;
            this.y += this.disperseVY;
        }
    }
    draw(opacity, disperseProgress){
        let alpha = opacity;
        if(enterDisperse){
            alpha = opacity * (1 - disperseProgress);
        }
        ctx.beginPath();
        ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
        ctx.fillStyle = `rgba(${COLOR_RGBA.join(',')},${alpha})`;
        ctx.fill();
    }
}
function initParticles(){
    particles = [];
    const targetCount = targetPoints.length;
    for(let i=0;i<targetCount;i++){
        particles.push(new Particle());
    }
    for(let i=0;i<particles.length;i++){
        const p = particles[i];
        const t = targetPoints[i % targetPoints.length];
        p.setTarget(t.x,t.y);
    }
}
resize();
initParticles();
window.addEventListener('resize',()=>{
    clearTimeout(resizeTimer);
    ctx.clearRect(0,0,w,h);
    resizeTimer = setTimeout(resize, RESIZE_DELAY);
});
function render(time){
    if(startTime === 0) startTime = time;
    // 拖尾画布清除
    ctx.fillStyle = `rgba(8,8,12,${TRAIL_ALPHA})`;
    ctx.fillRect(0,0,w,h);

    let progress = (time - startTime) / DURATION;
    if(progress >= 1){
        progress = 1;
        if(!finished){
            finished = true;
            holdStart = time;
            particles.forEach(p=>p.initDisperse());
        }
    }
    let disperseProgress = 0;
    if(finished && !enterDisperse){
        const holdTimeUsed = time - holdStart;
        if(holdTimeUsed >= HOLD_TIME){
            enterDisperse = true;
            disperseStart = time;
        }
    }
    if(enterDisperse){
        disperseProgress = Math.min(1, (time - disperseStart)/DISPERSE_DURATION);
        // 判断飞散动画全部完成
        if(disperseProgress >= 1 && !disperseComplete){
            disperseComplete = true;
            bgFadeStart = time;
        }
    }

    // 粒子绘制
    const alpha = 0.9;
    for(const p of particles){
        p.update(progress, time, disperseProgress);
        p.draw(alpha, disperseProgress);
    }

    // 动画全部结束：背景由黑变白，跳转home.html
    if(disperseComplete && !pageRedirected){
        const bgProgress = Math.min(1, (time - bgFadeStart) / FADE_BG_DURATION);
        // 平滑修改body背景色
        const r = Math.round(8 + (255 - 8) * bgProgress);
        const g = Math.round(8 + (255 - 8) * bgProgress);
        const b = Math.round(12 + (255 - 12) * bgProgress);
        document.body.style.background = `rgb(${r},${g},${b})`;
        
        // 背景变白完成后跳转同文件夹home.html
        if(bgProgress >= 1){
            pageRedirected = true;
            window.location.href = "./home.html";
        }
    }

    requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script>
</body>
</html>
