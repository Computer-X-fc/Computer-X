<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Computer X</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
    width:100%;height:100%;
    background:#080812;
    overflow:hidden;
}
canvas{display:block;width:100vw;height:100vh;}
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let w,h;
let particles = [];

const DURATION = 5000;
const FONT_SCALE = 0.21;
const TEXT_VERT_POS_RATIO = 0.5;
const STEP = 3;
const POINT_OFFSET = 5;
const PARTICLE_MIN_R = 0.3;
const PARTICLE_MAX_R = 1.0;
const BREATH_AMP = 1.2;
const BREATH_SPEED = 0.0015;
const TRAIL_ALPHA = 0.18;
const COLOR_RGBA = [110, 190, 255];
const RESIZE_DELAY = 120;
const SMOOTH_FACTOR = 0.08;

let startTime = 0;
let targetPoints = [];
let finished = false;
let resizeTimer = null;
const tempCanvas = document.createElement('canvas');
const tempCtx = tempCanvas.getContext('2d');

function resize(){
    w = canvas.width = innerWidth;
    h = canvas.height = innerHeight;
    tempCanvas.width = w;
    tempCanvas.height = h;
    targetPoints = createTargetPoints();
    if(targetPoints.length === 0) return;
    if(finished){
        adjustParticlesCount();
    }
}

function createTargetPoints(){
    const size = Math.min(w,h) * FONT_SCALE;
    tempCtx.clearRect(0,0,w,h);
    tempCtx.fillStyle="#fff";
    tempCtx.font = `bold ${size}px sans-serif`;
    tempCtx.textAlign="center";
    tempCtx.textBaseline="middle";
    tempCtx.fillText("Computer X", w/2, h * TEXT_VERT_POS_RATIO);

    const img = tempCtx.getImageData(0,0,w,h);
    const points = [];
    for(let y=0;y<h;y+=STEP){
        for(let x=0;x<w;x+=STEP){
            const i = (y*w + x)*4;
            if(img.data[i+3]>80){
                const px = x + (Math.random() - 0.5) * POINT_OFFSET;
                const py = y + (Math.random() - 0.5) * POINT_OFFSET;
                points.push({x:px,y:py});
            }
        }
    }
    return points;
}

function adjustParticlesCount(){
    const targetCount = targetPoints.length;
    while(particles.length < targetCount){
        const p = new Particle();
        p.resetRandom();
        particles.push(p);
    }
    while(particles.length > targetCount){
        particles.pop();
    }
    particles.forEach((p,i)=>{
        const t = targetPoints[i];
        p.targetX = t.x;
        p.targetY = t.y;
    });
}

class Particle{
    constructor(){
        this.resetRandom();
        this.targetX = 0;
        this.targetY = 0;
        this.tx = 0;
        this.ty = 0;
        this.breathPhase = Math.random() * Math.PI * 2;
    }
    resetRandom(){
        this.x = Math.random()*w;
        this.y = Math.random()*h;
        this.baseX = this.x;
        this.baseY = this.y;
        this.r = PARTICLE_MIN_R + Math.random()*(PARTICLE_MAX_R-PARTICLE_MIN_R);
    }
    setTarget(px,py){
        this.tx = px;
        this.ty = py;
    }
    update(progress, time){
        if(!finished){
            this.x = this.baseX + (this.tx - this.baseX)*progress;
            this.y = this.baseY + (this.ty - this.baseY)*progress;
        }else{
            this.x += (this.targetX - this.x) * SMOOTH_FACTOR;
            this.y += (this.targetY - this.y) * SMOOTH_FACTOR;
        }
        if(progress >= 1){
            const breathe = Math.sin(time * BREATH_SPEED + this.breathPhase) * BREATH_AMP;
            this.x += breathe;
            this.y += breathe;
        }
    }
    draw(opacity){
        ctx.beginPath();
        ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
        ctx.fillStyle = `rgba(${COLOR_RGBA.join(',')},${opacity})`;
        ctx.fill();
    }
}

function initParticles(){
    particles = [];
    const targetCount = targetPoints.length;
    for(let i=0;i<targetCount;i++){
        particles.push(new Particle());
    }
    for(let i=0;i<particles.length;i++){
        const p = particles[i];
        const t = targetPoints[i % targetPoints.length];
        p.setTarget(t.x,t.y);
    }
}

resize();
initParticles();
window.addEventListener('resize',()=>{
    clearTimeout(resizeTimer);
    ctx.clearRect(0,0,w,h);
    resizeTimer = setTimeout(resize, RESIZE_DELAY);
});

function render(time){
    if(startTime === 0) startTime = time;
    ctx.fillStyle = `rgba(8,8,12,${TRAIL_ALPHA})`;
    ctx.fillRect(0,0,w,h);

    let progress = (time - startTime) / DURATION;
    if(progress >= 1){
        progress = 1;
        finished = true;
    }
    const alpha = 0.9;

    for(const p of particles){
        p.update(progress, time);
        p.draw(alpha);
    }
    requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script>
</body>
</html>
